  - name: '10: An agent that writes to and reads from session.state.'
    benchmark_type: fix_error
    test_file: benchmarks/benchmark_definitions/fix_errors/tests/test_10_agent_with_state_management.py
    description: Create a `SequentialAgent` named 'root_agent' with two sub-agents. The first sub-agent, 'writer', should write a value to the session state. The second sub-agent, 'reader', should read that value from the session state and include it in its response.
    requirements:
      - The 'writer' agent should write the value 'xyz' to a key named 'my_value' in the session state.
      - The 'reader' agent should read the value from 'my_value' and the final response must contain 'xyz'.
      - The final solution must be assigned to a variable named `root_agent`.
    code_context:
      file: benchmarks/benchmark_definitions/fix_errors/tests/test_10_agent_with_state_management.py
    answer:
      rationale: Ground truth answer.
      benchmark_type: fix_error
      code: "|\n        from google.adk.agents import LlmAgent, SequentialAgent\n\n        MODEL_NAME = \"gemini-2.5-flash\"\n\n        writer_agent = LlmAgent(\n            name=\"writer_agent\",\n            model=MODEL_NAME,\n            instruction=\"Respond with only the text 'xyz'.\",\n            output_key=\"secret_word\",\n        )\n\n        reader_agent = LlmAgent(\n            name=\"reader_agent\",\n            model=MODEL_NAME,\n            instruction=\"Your only task is to output the content of '{secret_word}'. Do not add any other text.\",\n        )\n\n        root_agent = SequentialAgent(\n            name=\"state_management_coordinator\",\n            sub_agents=[writer_agent, reader_agent],\n        )"
