  - name: '20: Build integrity test for LlmAgent with expanded callbacks.'
    benchmark_type: fix_error
    test_file: benchmarks/benchmark_definitions/fix_errors/tests/test_20_expanded_callbacks.py
    description: Create an `LlmAgent` named 'root_agent' with `before_tool_callback` and `after_tool_callback`.
    requirements:
      - The agent should use `before_callback_func` as its `before_tool_callback`.
      - The agent should use `after_callback_func` as its `after_tool_callback`.
      - 'The final response should contain ''UNIQUE_TOOL_OUTPUT_FOR_TEST: hello''.'
      - The final solution must be assigned to a variable named `root_agent`.
    code_context:
      file: benchmarks/benchmark_definitions/fix_errors/tests/test_20_expanded_callbacks.py
    answer:
      rationale: Ground truth answer.
      benchmark_type: fix_error
      code: "|\n        from google.adk.agents import LlmAgent\n        from google.adk.tools.function_tool import FunctionTool\n\n        MODEL_NAME = \"gemini-2.5-flash\"\n\n        async def _mock_tool_func(query: str) -> str:\n            return f\"UNIQUE_TOOL_OUTPUT_FOR_TEST: {query}\"\n\n        before_called = []\n        after_called = []\n\n        async def before_callback_func(tool, args, tool_context):\n            before_called.append(True)\n            return None\n\n        async def after_callback_func(tool, args, tool_context, tool_response):\n            after_called.append(True)\n            return None\n\n        test_tool = FunctionTool(func=_mock_tool_func)\n\n        root_agent = LlmAgent(\n            name=\"callback_agent\",\n            model=MODEL_NAME,\n            instruction=\"Use the test_tool to respond to the user. Return the tool's output verbatim.\",\n            tools=[test_tool],\n            before_tool_callback=before_callback_func,\n            after_tool_callback=after_callback_func,\n        )"
