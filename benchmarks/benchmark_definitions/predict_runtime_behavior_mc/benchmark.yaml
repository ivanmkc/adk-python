benchmarks:
- question: 'Predict the error (if any) when running the following code:

    ```python

    a1 = LlmAgent(name="worker", model="gemini-2.5-flash")

    a2 = LlmAgent(name="worker", model="gemini-2.5-flash")

    root = SequentialAgent(name="root", sub_agents=[a1, a2])

    ```

    '
  options:
    A: 'ValueError: Agent name must be unique within the agent tree.'
    B: 'TypeError: LlmAgent cannot be instantiated twice.'
    C: No error, but the second agent will be ignored.
    D: No error, but 'worker' will be renamed to 'worker_1' automatically.
    E: None of the above
  correct_answer: E
  explanation: ADK generally enforces unique agent names. While `SequentialAgent`
    init might pass, `Runner` or `App` init/validation will fail if duplicate names
    exist in the tree. However, the snippet *only* shows instantiation. `SequentialAgent`
    init itself might not strictly validate sub-agent uniqueness immediately without
    an App context, but `BaseAgent` logic or `App` validation definitely will. The
    *most* correct prediction for a full run is A, but if we are strictly evaluating
    this snippet in isolation, it might pass until run. However, usually frameworks
    fail fast. Let's assume ADK enforces uniqueness. Wait, I need to verify if `SequentialAgent`
    checks this. If it doesn't, then 'No error' is correct for *just this snippet*.
    But usually these questions imply 'what happens when you try to use this'.
  benchmark_type: multiple_choice
- question: "Predict the error (if any) for this code:\n```python\nagent = LlmAgent(\n\
    \    name=\"user\",\n    model=\"gemini-2.5-flash\",\n    instruction=\"You are\
    \ a helpful assistant.\"\n)\n```\n"
  options:
    A: 'ValueError: Agent name cannot be `user`.'
    B: 'TypeError: `instruction` must be a list.'
    C: 'ValueError: Model name `gemini-2.5-flash` is invalid.'
    D: No error.
    E: None of the above
  correct_answer: A
  explanation: '`BaseAgent` validates that `name` cannot be ''user'' as it is reserved.'
  benchmark_type: multiple_choice
- question: "Predict the print output order for the following code (assuming the runner\
    \ executes successfully):\n```python\ndef pre(ctx): print(\"Pre\")\ndef post(ctx):\
    \ print(\"Post\")\nagent = LlmAgent(\n    name=\"test\", \n    model=\"gemini-2.5-flash\"\
    ,\n    before_agent_callback=pre, \n    after_agent_callback=post\n)\n# ... runner\
    \ setup and execution ...\n```\n"
  options:
    A: Pre, Post, (Agent Output)
    B: Pre, (Agent Output), Post
    C: (Agent Output), Pre, Post
    D: Post, Pre, (Agent Output)
    E: None of the above
  correct_answer: B
  explanation: '`before_agent_callback` runs before the agent execution, and `after_agent_callback`
    runs after.'
  benchmark_type: multiple_choice
- question: "Does the following code satisfy the specification: \"Create an agent\
    \ that automatically retries failed tool calls up to 3 times\"?\n```python\n#\
    \ ... imports ...\napp = App(\n    name=\"my_app\",\n    root_agent=my_agent,\n\
    \    plugins=[ReflectAndRetryToolPlugin(max_retries=3)]\n)\n```\n"
  options:
    A: Yes, this is the standard way to enable tool retries.
    B: No, `ReflectAndRetryToolPlugin` is not a valid plugin.
    C: No, you must configure retries in `RunConfig`.
    D: No, max_retries defaults to 0 so it must be set to 4.
    E: None of the above
  correct_answer: A
  explanation: '`ReflectAndRetryToolPlugin` with `max_retries=3` correctly implements
    the requirement.'
  benchmark_type: multiple_choice
- question: "Predict the error:\n```python\nagent = LlmAgent(\n    name=\"agent\"\
    ,\n    model=\"gemini-2.5-flash\",\n    generate_content_config=types.GenerateContentConfig(\n\
    \        tools=[my_tool]\n    )\n)\n```\n"
  options:
    A: 'TypeError: `tools` in `generate_content_config` must be a dict.'
    B: 'ValueError: All tools must be set via LlmAgent.tools.'
    C: No error.
    D: 'ValueError: `my_tool` is not defined.'
    E: None of the above
  correct_answer: B
  explanation: '`LlmAgent` validates that `generate_content_config` does not contain
    `tools`; they must be passed to the `tools` argument of `LlmAgent`.'
  benchmark_type: multiple_choice
- question: "Predict the error:\n```python\nagent = LlmAgent(\n    name=\"bad_agent\"\
    ,\n    model=\"gemini-2.5-flash\",\n    response_schema=MyPydanticModel\n)\n```\n"
  options:
    A: 'ValueError: `response_schema` is not a valid argument for `LlmAgent`.'
    B: 'TypeError: `response_schema` must be a dict.'
    C: No error.
    D: 'ValueError: Use `output_schema` instead of `response_schema`.'
    E: None of the above
  correct_answer: A
  explanation: '`LlmAgent` uses `output_schema`, not `response_schema`. `response_schema`
    is likely an invalid kwarg that Pydantic will reject if `extra=''forbid''` (which
    it is).'
  benchmark_type: multiple_choice
- question: "Does this code satisfy the spec: \"Ensure the agent strictly follows\
    \ a specific output JSON format defined by `MySchema`\"?\n```python\nagent = LlmAgent(\n\
    \    name=\"json_agent\",\n    model=\"gemini-2.5-flash\",\n    output_schema=MySchema\n\
    )\n```\n"
  options:
    A: Yes, `output_schema` enforces structured output.
    B: No, you must also set `output_format='json'`.
    C: No, `MySchema` must be converted to a dict first.
    D: No, structured output is only supported in `RunConfig`.
    E: None of the above
  correct_answer: A
  explanation: Setting `output_schema` on `LlmAgent` is the correct way to enforce
    structured JSON output.
  benchmark_type: multiple_choice
- question: "Predict the behavior:\n```python\nagent = LlmAgent(\n    name=\"stateless\"\
    ,\n    model=\"gemini-2.5-flash\",\n    include_contents=\"none\"\n)\n```\nWhat\
    \ happens when this agent runs multiple times in the same session?\n"
  options:
    A: It throws a `ValueError` because `include_contents` is deprecated.
    B: It remembers previous turns but ignores tool outputs.
    C: It treats every turn as a fresh start, ignoring previous conversation history.
    D: It keeps history in memory but does not send it to the model.
    E: None of the above
  correct_answer: C
  explanation: '`include_contents=''none''` means the model receives no prior history,
    operating solely on current instruction and input.'
  benchmark_type: multiple_choice
- question: "Predict the error when defining a loop agent:\n```python\nagent = LoopAgent(\n\
    \    name=\"looper\",\n    sub_agents=[]\n)\n```\n(Assuming `sub_agents` is optional\
    \ or defaults to empty list, but logic requires them).\n"
  options:
    A: 'ValueError: LoopAgent must have at least one sub-agent.'
    B: No error at instantiation, but it will do nothing when run.
    C: 'TypeError: `sub_agents` is required.'
    D: 'ValueError: `max_iterations` must be set.'
    E: None of the above
  correct_answer: B
  explanation: '`sub_agents` defaults to empty list. The `_run_async_impl` checks
    `if not self.sub_agents: return`. So it runs but does nothing. Thus ''No error
    at instantiation'' is correct.'
  benchmark_type: multiple_choice
- question: 'Spec: "Use a tool that requires a `session_id` parameter."

    Code:

    ```python

    def my_tool(query: str, session_id: str): ...

    ```

    How does ADK handle `session_id` injection?

    '
  options:
    A: It automatically injects `session_id` if the argument name matches.
    B: It throws an error because `session_id` is not in the user prompt.
    C: It requires `tool_context` to be accessed manually inside the tool.
    D: It only injects if the type hint is `SessionId`.
    E: None of the above
  correct_answer: E
  explanation: 'ADK injects context via `ToolContext`. You typically accept `tool_context:
    ToolContext` and access `tool_context.session_id`. It does *not* auto-inject by
    parameter name `session_id` directly into the function arguments unless you wrap
    it yourself or use a specific ADK feature I haven''t seen (usually it''s `tool_context`).
    Actually, `FunctionTool` might handle this if configured, but standard pattern
    is `ToolContext`. Let''s verify if ADK supports direct `session_id` injection.
    `FunctionTool` uses `inspect` to bind arguments. If `session_id` is expected by
    the function but not provided by LLM, it fails unless it''s `tool_context`. So
    A is likely false. Correct answer is likely related to using `tool_context`.'
  benchmark_type: multiple_choice
- question: "Predict the print output:\n```python\nagent = LlmAgent(name=\"a\", model=\"\
    ...\")\nprint(agent.name)\nagent.name = \"b\" \nprint(agent.name)\n```\n(Assuming\
    \ Pydantic model behavior).\n"
  options:
    A: a, then b
    B: a, then ValidationError (immutable)
    C: a, then a (ignored)
    D: 'Error: name is protected'
    E: None of the above
  correct_answer: A
  explanation: Pydantic models are mutable by default unless `frozen=True`. `BaseAgent`
    config does `extra='forbid'` but doesn't seem to set `frozen=True`. So 'a, then
    b' is likely correct.
  benchmark_type: multiple_choice
- question: 'Predict the error:

    ```python

    agent = LlmAgent(name="test", model="gemini-2.5-flash")

    clone = agent.clone(update={''unknown_field'': 123})

    ```

    '
  options:
    A: No error, field is added.
    B: 'ValueError: Cannot update nonexistent fields...'
    C: 'TypeError: Unexpected keyword argument...'
    D: 'AttributeError: ''LlmAgent'' object has no attribute ''unknown_field'''
    E: None of the above
  correct_answer: B
  explanation: '`clone` method explicitly checks `allowed_fields` and raises `ValueError`
    for invalid ones.'
  benchmark_type: multiple_choice
- question: 'An `LlmAgent` has `disallow_transfer_to_parent=True`. The model tries
    to transfer control to the parent agent.

    What happens?'
  options:
    A: The transfer is blocked, and the agent continues or terminates.
    B: The runner raises a RuntimeException.
    C: The transfer succeeds regardless of the flag.
    D: The agent enters an infinite loop.
  correct_answer: A
  explanation: The `disallow_transfer_to_parent` flag prevents the agent from transferring
    control back up the hierarchy.
  benchmark_type: predict_runtime_behavior_mc
- question: An `LlmAgent` has `include_contents='none'`. It has run for 3 turns. On
    the 4th turn, what history does the model see?
  options:
    A: No previous history, only the current input/instruction.
    B: All 3 previous turns.
    C: Only the immediately preceding turn.
    D: Only the system instruction.
  correct_answer: A
  explanation: '`include_contents=''none''` forces the agent to be stateless for the
    model, sending no history.'
  benchmark_type: predict_runtime_behavior_mc
- question: A `before_agent_callback` returns a `types.Content` object. What does
    the agent do?
  options:
    A: Skips the LLM call/agent logic and returns this content immediately.
    B: Appends this content to the user input and continues.
    C: Sends this content to the model as a system instruction.
    D: Raises an error because callbacks must return None.
  correct_answer: A
  explanation: If `before_agent_callback` returns content, the agent's execution is
    short-circuited.
  benchmark_type: predict_runtime_behavior_mc
- question: A `before_tool_callback` returns a dictionary. What happens?
  options:
    A: The actual tool execution is skipped, and this dictionary is used as the result.
    B: The dictionary is merged with the tool arguments.
    C: The tool runs, and this dictionary is ignored.
    D: The runner raises a ValueError.
  correct_answer: A
  explanation: Returning a value from `before_tool_callback` mocks the tool execution.
  benchmark_type: predict_runtime_behavior_mc
- question: You have a `SequentialAgent` with `[agent_a, agent_b]`. `agent_a` fails
    with an exception. What happens to `agent_b`?
  options:
    A: It is not executed.
    B: It runs immediately after the exception is logged.
    C: It runs with the exception as input.
    D: The runner retries `agent_a` then runs `agent_b`.
  correct_answer: A
  explanation: An unhandled exception in a sequential step halts the sequence.
  benchmark_type: predict_runtime_behavior_mc
- question: 'You define a `before_agent_callback` that returns a `types.Content` (not
    None).

    What is the runtime behavior?'
  options:
    A: Agent execution is skipped, content returned.
    B: The return value is ignored.
    C: The runner raises a warning.
    D: The runner raises a TypeError.
  correct_answer: A
  explanation: Returning a non-None value from this callback intercepts/modifies the
    flow.
  benchmark_type: predict_runtime_behavior_mc
