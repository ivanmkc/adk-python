# Requirement: All multiple-choice questions must include a 'None of the above' option.
benchmarks:
- question: 'Predict the error (if any) when running the following code:'
  code_snippet_ref:
    file: benchmarks/benchmark_definitions/predict_runtime_behavior_mc/snippets.py
    section: duplicate_agent_name
  options:
    A: No error, but the second agent will be ignored.
    B: 'TypeError: LlmAgent cannot be instantiated twice.'
    C: No error, but 'worker' will be renamed to 'worker_1' automatically.
    D: 'ValueError: Agent name must be unique within the agent tree.'
    E: None of the above
  correct_answer: E
  explanation: While unique agent names are a best practice, the `SequentialAgent` constructor does not strictly enforce uniqueness at runtime, so no error is raised.
  benchmark_type: multiple_choice

- question: "Predict the error (if any) for this code:"
  code_snippet_ref:
    file: benchmarks/benchmark_definitions/predict_runtime_behavior_mc/snippets.py
    section: reserved_agent_name
  options:
    A: 'ValueError: Model name `gemini-2.5-flash` is invalid.'
    B: No error.
    C: 'ValueError: Agent name cannot be `user`.'
    D: 'TypeError: `instruction` must be a list.'
    E: "ValidationError: 1 validation error for LlmAgent name   Value error, Agent name cannot be `user`. `user` is reserved for end-user's input. [type=value_error, input_value='user', input_type=str]     For further information visit https://errors.pydantic.dev/2.12/v/value_error"
  correct_answer: E
  explanation: '`BaseAgent` validates that `name` cannot be ''user'' as it is reserved.'
  benchmark_type: multiple_choice

- question: "Predict the print output order for the following code (assuming the runner executes successfully):"
  code_snippet_ref:
    file: benchmarks/benchmark_definitions/predict_runtime_behavior_mc/snippets.py
    section: callback_execution_order
  options:
    A: Pre, Post, (Agent Output)
    B: (Agent Output), Pre, Post
    C: Post, Pre, (Agent Output)
    D: Pre, (Agent Output), Post
    E: None of the above
  correct_answer: D
  explanation: '`before_agent_callback` runs before the agent execution, and `after_agent_callback` runs after.'
  benchmark_type: multiple_choice

- question: "Does the following code satisfy the specification: \"Create an agent that automatically retries failed tool calls up to 3 times\"?"
  code_snippet_ref:
    file: benchmarks/benchmark_definitions/predict_runtime_behavior_mc/snippets.py
    section: retry_plugin_config
  options:
    A: No, max_retries defaults to 0 so it must be set to 4.
    B: No, `ReflectAndRetryToolPlugin` is not a valid plugin.
    C: Yes, this is the standard way to enable tool retries.
    D: No, you must configure retries in `RunConfig`.
    E: None of the above
  correct_answer: C
  explanation: '`ReflectAndRetryToolPlugin` with `max_retries=3` correctly implements the requirement.'
  benchmark_type: multiple_choice

- question: "Predict the error:"
  code_snippet_ref:
    file: benchmarks/benchmark_definitions/predict_runtime_behavior_mc/snippets.py
    section: generate_content_config_tools_error
  options:
    A: 'ValueError: All tools must be set via LlmAgent.tools.'
    B: 'TypeError: `tools` in `generate_content_config` must be a dict.'
    C: 'ValueError: `my_tool` is not defined.'
    D: No error.
    E: "ValidationError: 1 validation error for LlmAgent generate_content_config   Value error, All tools must be set via LlmAgent.tools. [type=value_error, input_value=GenerateContentConfig(
   tools=[<function <lambda> at ...>,
   ] ), input_type=GenerateContentConfig]     For further information visit https://errors.pydantic.dev/2.12/v/value_error"
  correct_answer: E
  explanation: '`LlmAgent` validates that `generate_content_config` does not contain `tools`; they must be passed to the `tools` argument of `LlmAgent`.'
  benchmark_type: multiple_choice

- question: "Predict the error:"
  code_snippet_ref:
    file: benchmarks/benchmark_definitions/predict_runtime_behavior_mc/snippets.py
    section: response_schema_invalid_arg
  options:
    A: 'ValueError: Use `output_schema` instead of `response_schema`.'
    B: No error.
    C: 'TypeError: `response_schema` must be a dict.'
    D: 'ValueError: Extra inputs are not permitted'
    E: "ValidationError: 1 validation error for LlmAgent response_schema   Extra inputs are not permitted [type=extra_forbidden, input_value=<class 'test_code_predictions.<locals>.MyPydanticModel'>, input_type=ModelMetaclass]     For further information visit https://errors.pydantic.dev/2.12/v/extra_forbidden"
  correct_answer: E
  explanation: '`LlmAgent` uses `output_schema`, not `response_schema`. `response_schema` is likely an invalid kwarg that Pydantic will reject.'
  benchmark_type: multiple_choice

- question: "Does this code satisfy the spec: \"Ensure the agent strictly follows a specific output JSON format defined by `MySchema`\"?"
  code_snippet_ref:
    file: benchmarks/benchmark_definitions/predict_runtime_behavior_mc/snippets.py
    section: output_schema_json_enforcement
  options:
    A: No, structured output is only supported in `RunConfig`.
    B: No, you must also set `output_format='json'`.
    C: No, `MySchema` must be converted to a dict first.
    D: Yes, `output_schema` enforces structured output.
    E: None of the above
  correct_answer: D
  explanation: Setting `output_schema` on `LlmAgent` is the correct way to enforce structured JSON output.
  benchmark_type: multiple_choice

- question: "Predict the behavior:\nWhat happens when this agent runs multiple times in the same session?"
  code_snippet_ref:
    file: benchmarks/benchmark_definitions/predict_runtime_behavior_mc/snippets.py
    section: stateless_agent_history
  options:
    A: It remembers previous turns but ignores tool outputs.
    B: It keeps history in memory but does not send it to the model.
    C: It treats every turn as a fresh start, ignoring previous conversation history.
    D: It throws a `ValueError` because `include_contents` is deprecated.
    E: None of the above
  correct_answer: C
  explanation: '`include_contents=''none''` means the model receives no prior history, operating solely on current instruction and input.'
  benchmark_type: multiple_choice

- question: "Predict the error when defining a loop agent:
(Assuming `sub_agents` is optional or defaults to empty list, but logic requires them)."
  code_snippet_ref:
    file: benchmarks/benchmark_definitions/predict_runtime_behavior_mc/snippets.py
    section: loop_agent_empty_subagents
  options:
    A: 'TypeError: `sub_agents` is required.'
    B: 'ValueError: `max_iterations` must be set.'
    C: No error at instantiation, but it will do nothing when run.
    D: 'ValueError: LoopAgent must have at least one sub-agent.'
    E: None of the above
  correct_answer: C
  explanation: '`sub_agents` defaults to empty list. It runs but does nothing. Thus ''No error at instantiation'' is correct.'
  benchmark_type: multiple_choice

- question: 'Spec: "Use a tool that requires a `session_id` parameter."
How does ADK handle `session_id` injection?'
  code_snippet_ref:
    file: benchmarks/benchmark_definitions/predict_runtime_behavior_mc/snippets.py
    section: tool_session_id_injection
  options:
    A: It throws an error because `session_id` is not in the user prompt.
    B: It only injects if the type hint is `SessionId`.
    C: It requires `tool_context` to be accessed manually inside the tool.
    D: It automatically injects `session_id` if the argument name matches.
    E: None of the above
  correct_answer: E
  explanation: 'ADK injects context via `ToolContext`.'
  benchmark_type: multiple_choice

- question: "Predict the print output:
(Assuming Pydantic model behavior)."
  code_snippet_ref:
    file: benchmarks/benchmark_definitions/predict_runtime_behavior_mc/snippets.py
    section: agent_name_mutability
  options:
    A: a, then ValidationError (immutable)
    B: a, then a (ignored)
    C: 'Error: name is protected'
    D: "a\nb"
    E: None of the above
  correct_answer: D
  explanation: Pydantic models are mutable by default.
  benchmark_type: multiple_choice

- question: 'Predict the error:'
  code_snippet_ref:
    file: benchmarks/benchmark_definitions/predict_runtime_behavior_mc/snippets.py
    section: agent_clone_invalid_field
  options:
    A: No error, field is added.
    B: 'AttributeError: ''LlmAgent'' object has no attribute ''unknown_field'''
    C: 'TypeError: Unexpected keyword argument...'
    D: "ValueError: Cannot update nonexistent fields in LlmAgent: {'unknown_field'}"
    E: None of the above
  correct_answer: D
  explanation: '`clone` method explicitly checks `allowed_fields` and raises `ValueError`.'
  benchmark_type: multiple_choice

- question: 'Predict the standard output of the following Python code:'
  code_snippet_ref:
    file: benchmarks/benchmark_definitions/predict_runtime_behavior_mc/snippets.py
    section: event_repr_output
  options:
    A: 'response: Hello'
    B: 'ValueError: Input should be a valid dictionary or object to extract fields from'
    C: 'Event(type=''model_response''): Hello'
    D: 'model_response: None'
    E: "ValidationError: 3 validation errors for Event content   Input should be a valid dictionary or object to extract fields from [type=model_attributes_type, input_value='Hello', input_type=str]     For further information visit https://errors.pydantic.dev/2.12/v/model_attributes_type author   Field required [type=missing, input_value={'type': 'model_response', 'content': 'Hello'}, input_type=dict]     For further information visit https://errors.pydantic.dev/2.12/v/missing type   Extra inputs are not permitted [type=extra_forbidden, input_value='model_response', input_type=str]     For further information visit https://errors.pydantic.dev/2.12/v/extra_forbidden"
  correct_answer: E
  explanation: The Event object stores `type` and `content` as attributes.
  benchmark_type: multiple_choice

- question: 'Predict the standard output of the following Python code:'
  code_snippet_ref:
    file: benchmarks/benchmark_definitions/predict_runtime_behavior_mc/snippets.py
    section: session_state_mutability
  options:
    A: 'Error: Session state is immutable'
    B: 'ValueError: Field required'
    C: '{''user'': ''Alice'', ''count'': 1}'
    D: '{''user'': ''Alice''}'
    E: "{'user': 'Alice', 'count': 2}"
  correct_answer: E
  explanation: Session state is a mutable dictionary-like object.
  benchmark_type: multiple_choice

- question: "Predict the standard output of the following Python code:"
  code_snippet_ref:
    file: benchmarks/benchmark_definitions/predict_runtime_behavior_mc/snippets.py
    section: function_tool_async_run
  options:
    A: '{''result'': 8}'
    B: None
    C: 'Error: FunctionTool.__init__() got an unexpected keyword argument ''fn'''
    D: '53'
    E: None of the above
  correct_answer: C
  explanation: FunctionTool wraps the function and returns the result. `run_async` returns a ToolResult object.
  benchmark_type: multiple_choice

- question: "Predict the standard output of the following Python code:"
  code_snippet_ref:
    file: benchmarks/benchmark_definitions/predict_runtime_behavior_mc/snippets.py
    section: llm_agent_name_validation
  options:
    A: Caught Error
    B: invalid name
    C: Caught TypeError
    D: No Output
    E: "ValidationError: 1 validation error for LlmAgent name   Value error, Found invalid agent name: `invalid name`. Agent name must be a valid identifier. It should start with a letter (a-z, A-Z) or an underscore (_), and can only contain letters, digits (0-9), and underscores. [type=value_error, input_value='invalid name', input_type=str]     For further information visit https://errors.pydantic.dev/2.12/v/value_error"
  correct_answer: E
  explanation: LlmAgent validates the name format (spaces are not allowed), raising a ValueError.
  benchmark_type: multiple_choice

- question: "Predict the standard output of the following Python code:"
  code_snippet_ref:
    file: benchmarks/benchmark_definitions/predict_runtime_behavior_mc/snippets.py
    section: event_extra_fields_error
  options:
    A: random_field
    B: No Output
    C: Event(type='custom')
    D: Validation Error
    E: "ValidationError: 3 validation errors for Event author   Field required [type=missing, input_value={'type': 'custom', 'random_field': '123'}, input_type=dict]     For further information visit https://errors.pydantic.dev/2.12/v/missing type   Extra inputs are not permitted [type=extra_forbidden, input_value='custom', input_type=str]     For further information visit https://errors.pydantic.dev/2.12/v/extra_forbidden random_field   Extra inputs are not permitted [type=extra_forbidden, input_value='123', input_type=str]     For further information visit https://errors.pydantic.dev/2.12/v/extra_forbidden"
  correct_answer: E
  explanation: The `Event` class is a strict Pydantic model. It raises ValidationError, caught by except, printing 'Validation Error'.
  benchmark_type: multiple_choice
