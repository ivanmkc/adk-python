    B: No error.
    C: 'TypeError: thinking_config not supported.'
    D: 'ValueError: Model does not support thinking.'
  correct_answer: A
  explanation: Thinking config must be configured via the `planner` field.
  benchmark_type: diagnose_setup_errors_mc
- question: "You provide an invalid tool config in YAML.\n```yaml\ntools:\n  - name:\
