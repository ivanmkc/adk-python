# Requirement: All multiple-choice questions must include a 'None of the above' option.
benchmarks:
- question: "You are defining a simple `LlmAgent` but receiving a `TypeError` about\
    \ missing arguments.\nThe code looks like this:\n```python\nroot_agent = LlmAgent(\n\
    \    name=\"my_agent\",\n    instruction=\"You are a helpful assistant.\"\n)\n\
    ```\nWhat is the error?"
  options:
    A: The `instruction` argument must be a list of strings.
    B: The `LlmAgent` class is missing the required `model` argument.
    C: The `name` argument must be unique across the entire project.
    D: You must always provide a `tools` list, even if empty.
    E: None of the above
  correct_answer: B
  explanation: LlmAgent requires a `model` argument to function.
  benchmark_type: multiple_choice
- question: "You want to give your agent access to a Python function named `calculate_tax`.\n\
    You try:\n```python\nroot_agent = LlmAgent(\n    name=\"tax_agent\",\n    model=\"\
    gemini-2.5-flash\",\n    tools=[calculate_tax]\n)\n```\nWhy does this fail or\
    \ behave incorrectly?"
  options:
    A: Tools must be defined in a separate file.
    B: The function must be a static method of a class.
    C: The argument name should be `functions`, not `tools`.
    D: Raw Python functions must be wrapped in `FunctionTool`.
    E: None of the above
  correct_answer: D
  explanation: Raw functions must be wrapped using `FunctionTool`.
  benchmark_type: multiple_choice
- question: "You want `agent_one` to run first, followed by `agent_two`. You write:\n\
    ```python\nroot_agent = SequentialAgent(\n    name=\"sequence\",\n    tools=[agent_one,\
    \ agent_two]\n)\n```\nWhat is the error in this definition?"
  options:
    A: SequentialAgent does not support `LlmAgent` instances.
    B: The `instruction` parameter is missing and is required for `SequentialAgent`.
    C: You must use `ParallelAgent` for multiple agents.
    D: Agents should be passed to the `sub_agents` parameter, not `tools`.
    E: None of the above
  correct_answer: D
  explanation: SequentialAgent takes a list of agents in the `sub_agents` parameter.
  benchmark_type: multiple_choice
- question: "You want your agent to be able to run Python code. You attempt:\n```python\n\
    root_agent = LlmAgent(\n    name=\"coder\",\n    model=\"gemini-2.5-flash\",\n\
    \    tools=[BuiltInCodeExecutor()]\n)\n```\nHow should this be fixed to correctly\
    \ enable the code executor?"
  options:
    A: Wrap `BuiltInCodeExecutor` inside `FunctionTool`.
    B: Add `enable_code_execution=True` to the constructor.
    C: Pass the executor instance to the `code_executor` parameter, not `tools`.
    D: Use the `CodeAgent` class instead of `LlmAgent`.
    E: None of the above
  correct_answer: C
  explanation: BuiltInCodeExecutor is passed to the dedicated `code_executor` argument.
  benchmark_type: multiple_choice
- question: "You have a `root_agent` and a `specialist_agent`. You want the root to\
    \ delegate tasks to the specialist.\n```python\nroot_agent = LlmAgent(\n    name=\"\
    manager\",\n    model=\"gemini-2.5-flash\",\n    tools=[specialist_agent]\n)\n\
    ```\nWhat is the correct way to register the specialist for delegation?"
  options:
    A: Use `child_agents=[specialist_agent]`.
    B: Keep it in `tools`, but ensure the specialist has a `description`.
    C: Use `sub_agents=[specialist_agent]`.
    D: Use `delegates=[specialist_agent]`.
    E: None of the above
  correct_answer: C
  explanation: Other agents are registered via the `sub_agents` parameter to enable
    delegation.
  benchmark_type: multiple_choice
- question: "You want two agents to run at the same time and combine their results.\n\
    ```python\nroot_agent = MultiAgent(\n    name=\"parallel_run\",\n    agents=[agent_a,\
    \ agent_b]\n)\n```\n`MultiAgent` is not a valid class. Which class should you\
    \ use?"
  options:
    A: ParallelAgent
    B: ConcurrentAgent
    C: BatchAgent
    D: AsyncAgent
    E: None of the above
  correct_answer: A
  explanation: ParallelAgent is used for running agents concurrently.
  benchmark_type: multiple_choice
- question: "You want your agent to process input that matches a specific Pydantic\
    \ model `UserInfo`.\n```python\nclass UserInfo(BaseModel):\n    name: str\n  \
    \  age: int\n\nroot_agent = LlmAgent(\n    name=\"form_filler\",\n    model=\"\
    gemini-2.5-flash\",\n    input_schema=UserInfo()\n)\n```\nWhat is the error in\
    \ the `input_schema` assignment?"
  options:
    A: You should pass the class `UserInfo`, not an instance `UserInfo()`.
    B: '`input_schema` only accepts JSON schemas (dicts), not Pydantic models.'
    C: Pydantic models must be wrapped in `SchemaTool`.
    D: The field should be named `response_model`.
    E: None of the above
  correct_answer: A
  explanation: The class itself (`UserInfo`) is passed to `input_schema`, not an instance.
  benchmark_type: multiple_choice
- question: 'You encounter a `NameError: name ''FunctionTool'' is not defined`. Which
    import statement is likely missing?'
  options:
    A: from google.adk.utils import FunctionTool
    B: from google.adk.agents import FunctionTool
    C: from google.adk.tools import FunctionTool
    D: from google.adk.tools.function_tool import FunctionTool
    E: None of the above
  correct_answer: D
  explanation: FunctionTool is imported from `google.adk.tools.function_tool`.
  benchmark_type: multiple_choice
- question: 'Your root agent has a `specialist_agent` in its `sub_agents` list, but
    it never delegates to it, even when asked.

    What is the most likely missing component in the **specialist''s** definition?'
  options:
    A: The specialist is missing an `instruction`.
    B: The specialist must use a different model than the root.
    C: The specialist is missing a `description`.
    D: The specialist must be defined in a separate file.
    E: None of the above
  correct_answer: C
  explanation: The specialist needs a `description` for the root agent's planner to
    know when to use it.
  benchmark_type: multiple_choice
- question: "You want to force the LLM to output JSON matching a specific schema.\n\
    ```python\nroot_agent = LlmAgent(\n    name=\"json_agent\",\n    model=\"gemini-2.5-flash\"\
    ,\n    output_format=\"json\",\n    schema=MyPydanticModel\n)\n```\nWhat are the\
    \ correct parameters to achieve this?"
  options:
    A: output_schema=MyPydanticModel
    B: structured_output=MyPydanticModel
    C: response_format='json', response_schema=MyPydanticModel
    D: format=MyPydanticModel
    E: None of the above
  correct_answer: A
  explanation: '`output_schema` is the standard parameter for enforcing structured
    output.'
  benchmark_type: multiple_choice
