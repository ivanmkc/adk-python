- question: "You try to set `system_instruction` inside `generate_content_config`.\n\
    ```python\nagent = LlmAgent(\n    name='agent',\n    model='gemini-1.5-pro',\n\
    \    generate_content_config=types.GenerateContentConfig(system_instruction='Hi')\n\
    )\n```\nWhat error does this cause?"
  options:
    A: 'ValueError: generate_content_config is read-only.'
    B: No error, it works as expected.
    C: 'TypeError: system_instruction must be a Content object.'
    D: 'ValueError: System instruction must be set via LlmAgent.instruction.'
    E: None of the above
  correct_answer: D
