- question: 'You try to clone an agent and update `parent_agent`.

    ```python

    new_agent = agent.clone(update={''parent_agent'': other_agent})

    ```

    What error occurs?'
  options:
    A: 'ValueError: Cannot update `parent_agent` field in clone.'
    B: No error.
    C: 'TypeError: parent_agent is immutable.'
    D: 'AttributeError: parent_agent is read-only.'
  correct_answer: A
  explanation: '`parent_agent` cannot be updated during cloning; it is set when added
    to a parent''s sub_agents.'
  benchmark_type: diagnose_setup_errors_mc
- question: 'You try to clone an agent and update a non-existent field.

    ```python

    new_agent = agent.clone(update={''random_field'': 123})

    ```

    What error occurs?'
  options:
    A: 'ValueError: Cannot update nonexistent fields...'
    B: No error, field is added.
    C: AttributeError.
    D: TypeError.
  correct_answer: A
  explanation: '`clone` validates that updated fields exist on the agent class.'
  benchmark_type: diagnose_setup_errors_mc
- question: 'You initialize a `SequentialAgent` without `sub_agents`.

    ```python

    agent = SequentialAgent(name=''seq'')

    ```

    What happens?'
  options:
    A: No error, but it won't do anything useful.
    B: 'ValueError: SequentialAgent requires at least one sub-agent.'
    C: 'TypeError: Missing required argument ''sub_agents''.'
    D: RuntimeError on initialization.
  correct_answer: A
  explanation: '`sub_agents` defaults to an empty list. It is valid setup, though
    functionally empty.'
  benchmark_type: diagnose_setup_errors_mc
- question: 'You try to add an agent as a sub-agent to two different parents.

    ```python

    parent1 = SequentialAgent(name=''p1'', sub_agents=[child])

    parent2 = SequentialAgent(name=''p2'', sub_agents=[child])

    ```

    What error occurs?'
  options:
    A: 'ValueError: Agent `child` already has a parent agent...'
    B: No error, shared ownership is allowed.
    C: 'RuntimeError: Circular dependency.'
    D: 'TypeError: Agent cannot be reused.'
  correct_answer: A
  explanation: An agent instance can only have one parent. It checks `parent_agent`
    is None before assignment.
  benchmark_type: diagnose_setup_errors_mc
- question: 'You initialize an `LlmAgent` with a `thinking_config` in `generate_content_config`.

