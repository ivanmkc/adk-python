benchmarks:
- question: "You are defining a simple `LlmAgent` but receiving a `TypeError` about\
    \ missing arguments.\nThe code looks like this:\n```python\nroot_agent = LlmAgent(\n\
    \    name=\"my_agent\",\n    instruction=\"You are a helpful assistant.\"\n)\n\
    ```\nWhat is the error?\n"
  options:
    A: The `instruction` argument must be a list of strings.
    B: The `LlmAgent` class is missing the required `model` argument.
    C: You must always provide a `tools` list, even if empty.
    D: The `name` argument must be unique across the entire project.
  correct_answer: B
  explanation: LlmAgent requires a `model` argument to function.
  benchmark_type: multiple_choice
- question: "You want to give your agent access to a Python function named `calculate_tax`.\n\
    You try:\n```python\nroot_agent = LlmAgent(\n    name=\"tax_agent\",\n    model=\"\
    gemini-2.5-flash\",\n    tools=[calculate_tax]\n)\n```\nWhy does this fail or\
    \ behave incorrectly?\n"
  options:
    A: Tools must be defined in a separate file.
    B: The function must be a static method of a class.
    C: Raw Python functions must be wrapped in `FunctionTool`.
    D: The argument name should be `functions`, not `tools`.
  correct_answer: C
  explanation: Raw functions must be wrapped using `FunctionTool`.
  benchmark_type: multiple_choice
- question: "You want `agent_one` to run first, followed by `agent_two`. You write:\n\
    ```python\nroot_agent = SequentialAgent(\n    name=\"sequence\",\n    tools=[agent_one,\
    \ agent_two]\n)\n```\nWhat is the error in this definition?\n"
  options:
    A: SequentialAgent does not support `LlmAgent` instances.
    B: Agents should be passed to the `sub_agents` parameter, not `tools`.
    C: You must use `ParallelAgent` for multiple agents.
    D: The `instruction` parameter is missing and is required for `SequentialAgent`.
  correct_answer: B
  explanation: SequentialAgent takes a list of agents in the `sub_agents` parameter.
  benchmark_type: multiple_choice
- question: "You want your agent to be able to run Python code. You attempt:\n```python\n\
    root_agent = LlmAgent(\n    name=\"coder\",\n    model=\"gemini-2.5-flash\",\n\
    \    tools=[BuiltInCodeExecutor()]\n)\n```\nHow should this be fixed to correctly\
    \ enable the code executor?\n"
  options:
    A: Use the `CodeAgent` class instead of `LlmAgent`.
    B: Pass the executor instance to the `code_executor` parameter, not `tools`.
    C: Add `enable_code_execution=True` to the constructor.
    D: Wrap `BuiltInCodeExecutor` inside `FunctionTool`.
  correct_answer: B
  explanation: BuiltInCodeExecutor is passed to the dedicated `code_executor` argument.
  benchmark_type: multiple_choice
- question: "You have a `root_agent` and a `specialist_agent`. You want the root to\
    \ delegate tasks to the specialist.\n```python\nroot_agent = LlmAgent(\n    name=\"\
    manager\",\n    model=\"gemini-2.5-flash\",\n    tools=[specialist_agent]\n)\n\
    ```\nWhat is the correct way to register the specialist for delegation?\n"
  options:
    A: Use `sub_agents=[specialist_agent]`.
    B: Use `delegates=[specialist_agent]`.
    C: Use `child_agents=[specialist_agent]`.
    D: Keep it in `tools`, but ensure the specialist has a `description`.
  correct_answer: A
  explanation: Other agents are registered via the `sub_agents` parameter to enable
    delegation.
  benchmark_type: multiple_choice
- question: "You want two agents to run at the same time and combine their results.\n\
    ```python\nroot_agent = MultiAgent(\n    name=\"parallel_run\",\n    agents=[agent_a,\
    \ agent_b]\n)\n```\n`MultiAgent` is not a valid class. Which class should you\
    \ use?\n"
  options:
    A: ConcurrentAgent
    B: AsyncAgent
    C: ParallelAgent
    D: BatchAgent
  correct_answer: C
  explanation: ParallelAgent is used for running agents concurrently.
  benchmark_type: multiple_choice
- question: "You want your agent to process input that matches a specific Pydantic\
    \ model `UserInfo`.\n```python\nclass UserInfo(BaseModel):\n    name: str\n  \
    \  age: int\n\nroot_agent = LlmAgent(\n    name=\"form_filler\",\n    model=\"\
    gemini-2.5-flash\",\n    input_schema=UserInfo()\n)\n```\nWhat is the error in\
    \ the `input_schema` assignment?\n"
  options:
    A: '`input_schema` only accepts JSON schemas (dicts), not Pydantic models.'
    B: You should pass the class `UserInfo`, not an instance `UserInfo()`.
    C: The field should be named `response_model`.
    D: Pydantic models must be wrapped in `SchemaTool`.
  correct_answer: B
  explanation: The class itself (`UserInfo`) is passed to `input_schema`, not an instance.
  benchmark_type: multiple_choice
- question: 'You encounter a `NameError: name ''FunctionTool'' is not defined`. Which
    import statement is likely missing?

    '
  options:
    A: from google.adk.tools import FunctionTool
    B: from google.adk.agents import FunctionTool
    C: from google.adk.utils import FunctionTool
    D: from google.adk.tools.function_tool import FunctionTool
  correct_answer: D
  explanation: FunctionTool is imported from `google.adk.tools.function_tool`.
  benchmark_type: multiple_choice
- question: 'Your root agent has a `specialist_agent` in its `sub_agents` list, but
    it never delegates to it, even when asked.

    What is the most likely missing component in the **specialist''s** definition?

    '
  options:
    A: The specialist is missing a `description`.
    B: The specialist is missing an `instruction`.
    C: The specialist must use a different model than the root.
    D: The specialist must be defined in a separate file.
  correct_answer: A
  explanation: The specialist needs a `description` for the root agent's planner to
    know when to use it.
  benchmark_type: multiple_choice
- question: "You want to force the LLM to output JSON matching a specific schema.\n\
    ```python\nroot_agent = LlmAgent(\n    name=\"json_agent\",\n    model=\"gemini-2.5-flash\"\
    ,\n    output_format=\"json\",\n    schema=MyPydanticModel\n)\n```\nWhat are the\
    \ correct parameters to achieve this?\n"
  options:
    A: response_format='json', response_schema=MyPydanticModel
    B: output_schema=MyPydanticModel
    C: format=MyPydanticModel
    D: structured_output=MyPydanticModel
  correct_answer: B
  explanation: '`output_schema` is the standard parameter for enforcing structured
    output.'
  benchmark_type: multiple_choice
- question: 'You try to define an agent with the name ''user''.

    ```python

    agent = LlmAgent(name=''user'', model=''gemini-1.5-pro'')

    ```

    What error occurs?'
  options:
    A: No error, 'user' is a valid name.
    B: 'ValueError: Agent name cannot be `user`.'
    C: 'TypeError: Name must be an integer.'
    D: 'RuntimeError: User agent already exists.'
  correct_answer: B
  explanation: '`user` is a reserved name for end-user input.'
  benchmark_type: diagnose_setup_errors_mc
- question: 'You define an agent with an invalid name ''my-agent''.

    ```python

    agent = LlmAgent(name=''my-agent'', model=''gemini-1.5-pro'')

    ```

    What validation error is raised?'
  options:
    A: 'ValueError: Agent name must be a valid identifier.'
    B: 'ValueError: Agent name cannot contain hyphens.'
    C: No error.
    D: SyntaxError.
  correct_answer: A
  explanation: Agent names must be valid Python identifiers (letters, numbers, underscores).
  benchmark_type: diagnose_setup_errors_mc
- question: "You try to set `system_instruction` inside `generate_content_config`.\n\
    ```python\nagent = LlmAgent(\n    name='agent',\n    model='gemini-1.5-pro',\n\
    \    generate_content_config=types.GenerateContentConfig(system_instruction='Hi')\n\
    )\n```\nWhat error does this cause?"
  options:
    A: No error, it works as expected.
    B: 'ValueError: System instruction must be set via LlmAgent.instruction.'
    C: 'TypeError: system_instruction must be a Content object.'
    D: 'ValueError: generate_content_config is read-only.'
  correct_answer: B
  explanation: LlmAgent enforces that instructions are set via the `instruction` or
    `static_instruction` fields, not `generate_content_config`.
  benchmark_type: diagnose_setup_errors_mc
- question: "You try to set `tools` inside `generate_content_config`.\n```python\n\
    agent = LlmAgent(\n    name='agent',\n    model='gemini-1.5-pro',\n    generate_content_config=types.GenerateContentConfig(tools=[tool])\n\
    )\n```\nWhat error occurs?"
  options:
    A: 'ValueError: All tools must be set via LlmAgent.tools.'
    B: No error.
    C: 'TypeError: Tools must be a list of functions.'
    D: 'ValueError: Tools are not supported in this model.'
  correct_answer: A
  explanation: Tools must be configured via the `tools` parameter of `LlmAgent`.
  benchmark_type: diagnose_setup_errors_mc
- question: "You try to set `response_schema` inside `generate_content_config`.\n\
    ```python\nagent = LlmAgent(\n    name='agent',\n    model='gemini-1.5-pro',\n\
    \    generate_content_config=types.GenerateContentConfig(response_schema=schema)\n\
    )\n```\nWhat error occurs?"
  options:
    A: 'ValueError: Response schema must be set via LlmAgent.output_schema.'
    B: No error.
    C: 'TypeError: Schema must be a dict.'
    D: 'ValueError: response_schema is deprecated.'
  correct_answer: A
  explanation: Structured output should be configured via `output_schema` on the `LlmAgent`.
  benchmark_type: diagnose_setup_errors_mc
- question: 'You try to initialize a `Runner` with both `app` and `agent`.

    ```python

    runner = Runner(app=my_app, agent=my_agent)

    ```

    What error is raised?'
  options:
    A: 'ValueError: When app is provided, agent should not be provided.'
    B: No error, agent overrides app.root_agent.
    C: 'TypeError: Multiple values for argument ''agent''.'
    D: 'ValueError: App name mismatch.'
  correct_answer: A
  explanation: '`app` and `agent` arguments are mutually exclusive in `Runner` initialization.'
  benchmark_type: diagnose_setup_errors_mc
- question: 'You try to initialize a `Runner` without `app` and without `app_name`.

    ```python

    runner = Runner(agent=my_agent)

    ```

    What error occurs?'
  options:
    A: 'ValueError: Either app or both app_name and agent must be provided.'
    B: No error, app_name defaults to 'default'.
    C: 'ValueError: Agent must have a name.'
    D: 'AttributeError: ''NoneType'' object has no attribute ''name''.'
  correct_answer: A
  explanation: If `app` is not provided, `app_name` is required.
  benchmark_type: diagnose_setup_errors_mc
