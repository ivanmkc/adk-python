benchmarks:
- question: 'Which is the correct import statement for the `Runner` class?

    '
  options:
    A: from google.adk.factory import Runner
    B: from google.adk.runners import Runner
    C: from google.adk.core import Runner
    D: from google.adk.agent_runner import Runner
    E: None of the above
  correct_answer: B
  explanation: '`Runner` is defined in `google.adk.runners` (and re-exported in `google.adk`).'
  benchmark_type: multiple_choice
- question: 'You need to inspect an `Event` object. Which import allows you to reference
    the `Event` class for type hinting?

    '
  options:
    A: from google.adk.event import Event
    B: from google.adk.types import Event
    C: from google.adk.core.events import Event
    D: from google.adk.models import Event
    E: None of the above
  correct_answer: E
  explanation: The correct import is `from google.adk.events.event import Event`.
  benchmark_type: multiple_choice
- question: 'When calling `runner.run_async()`, which parameter is used to pass the
    user''s input message?

    '
  options:
    A: message
    B: input
    C: new_message
    D: content
    E: None of the above
  correct_answer: C
  explanation: The parameter `new_message` is used to pass the user's input content.
  benchmark_type: multiple_choice
- question: 'You are initializing an `App`. Which parameter is mutually exclusive
    with providing `app_name` and `root_agent` directly to the `Runner`?

    '
  options:
    A: plugins
    B: application
    C: context_cache_config
    D: resumability_config
    E: None of the above
  correct_answer: E
  explanation: The correct parameter is `app`. You provide either an `App` object
    via `app` OR `app_name` and `agent` separately.
  benchmark_type: multiple_choice
- question: 'Which Google GenAI type represents the fundamental unit of content (text,
    image, function call) within a message?

    '
  options:
    A: types.Item
    B: types.Chunk
    C: types.Part
    D: types.Element
    E: None of the above
  correct_answer: C
  explanation: '`types.Part` is the atomic unit of content in the Gemini API and ADK.'
  benchmark_type: multiple_choice
- question: 'How do you correctly construct a user message content object with text?

    '
  options:
    A: types.Content(role='user', text='Hello')
    B: types.Content(role='user', parts=[types.Part(text='Hello')])
    C: types.Message(role='user', content='Hello')
    D: types.UserMessage(text='Hello')
    E: None of the above
  correct_answer: B
  explanation: '`types.Content` takes a list of `types.Part` objects in the `parts`
    parameter.'
  benchmark_type: multiple_choice
- question: 'When defining a custom agent class, which abstract base class must you
    inherit from?

    '
  options:
    A: Agent
    B: AdkAgent
    C: AbstractAgent
    D: CustomAgent
    E: None of the above
  correct_answer: E
  explanation: The correct base class is `BaseAgent` (from `google.adk.agents.base_agent`).
  benchmark_type: multiple_choice
- question: 'You are implementing a custom tool. Which method must you implement from
    `BaseTool`?

    '
  options:
    A: run()
    B: execute()
    C: __call__()
    D: The method defined in the tool's definition (schema).
    E: None of the above
  correct_answer: D
  explanation: '`BaseTool` implementation details depend on the specific tool type
    (e.g., `FunctionTool` wraps a callable), but generally, the runner invokes the
    underlying function.'
  benchmark_type: multiple_choice
- question: 'What is the correct signature for a `before_tool_callback` function?

    '
  options:
    A: 'async def callback(tool, args, context):'
    B: 'def callback(tool, args):'
    C: 'async def callback(tool_name, arguments):'
    D: 'async def callback(tool, args, context, response):'
    E: None of the above
  correct_answer: A
  explanation: 'The signature is `async def callback(tool: BaseTool, args: dict, tool_context:
    ToolContext)`.'
  benchmark_type: multiple_choice
- question: 'In a `BasePlugin`, what is the correct signature for `run_on_event_callback`?

    '
  options:
    A: 'async def run_on_event_callback(self, event: Event) -> Event:'
    B: 'async def run_on_event_callback(self, invocation_context: InvocationContext,
      event: Event) -> Optional[Event]:'
    C: 'def run_on_event_callback(self, event: Event):'
    D: 'async def run_on_event_callback(self, context: dict, event: Event) -> Event:'
    E: None of the above
  correct_answer: B
  explanation: The callback receives the `InvocationContext` and the `Event`, and
    returns an optional modified `Event`.
  benchmark_type: multiple_choice
- question: 'What is the primary purpose of `InvocationContext`?

    '
  options:
    A: To store the chat history of the session.
    B: To manage the state and dependencies (services, config) for a single agent
      execution turn.
    C: To configure the LLM's generation parameters.
    D: To define the tools available to the agent.
    E: None of the above
  correct_answer: B
  explanation: '`InvocationContext` holds the scoped state, services, and configuration
    for the current run/invocation.'
  benchmark_type: multiple_choice
- question: 'You want to create a custom artifact service. Which class should you
    inherit from?

    '
  options:
    A: ArtifactManager
    B: BaseArtifactService
    C: ArtifactProvider
    D: StorageService
    E: None of the above
  correct_answer: B
  explanation: '`BaseArtifactService` is the ABC for implementing artifact storage
    backends.'
  benchmark_type: multiple_choice
- question: 'How do you configure an `App` to automatically compact events in the
    session history?

    '
  options:
    A: Set `auto_compact=True` in the `Runner` constructor.
    B: Pass an `EventsCompactionConfig` object to the `events_compaction_config` parameter
      of the `App` constructor.
    C: Call `app.compact_events()` manually before every run.
    D: Use the `CompactionPlugin` in the plugins list.
    E: None of the above
  correct_answer: B
  explanation: Event compaction is configured at the App level using `EventsCompactionConfig`.
  benchmark_type: multiple_choice
- question: 'When using `InMemorySessionService`, how is session data persisted?

    '
  options:
    A: It is saved to a local JSON file.
    B: It is stored in a SQLite database.
    C: It is kept in a Python dictionary in RAM and lost when the process exits.
    D: It is uploaded to Google Cloud Storage.
    E: None of the above
  correct_answer: C
  explanation: '`InMemorySessionService` is ephemeral and stores data only in memory.'
  benchmark_type: multiple_choice
- question: 'What is the purpose of the `state_delta` parameter in `runner.run_async`?

    '
  options:
    A: To update the agent's configuration for the current run.
    B: To modify the session state (variables shared across agents) for the current
      invocation.
    C: To change the LLM's system instruction dynamically.
    D: To inject temporary tools for the current turn.
    E: None of the above
  correct_answer: B
  explanation: '`state_delta` allows you to inject or update session state variables
    at the start of a run.'
  benchmark_type: multiple_choice
- question: 'You want to implement a ''human-in-the-loop'' workflow where the agent
    asks for confirmation before executing a sensitive tool. Which mechanism is best
    suited for this?

    '
  options:
    A: Use a `SequentialAgent` with a `HumanAgent`.
    B: Raise a `ToolConfirmationRequest` exception in the tool's execution logic.
    C: This is not supported in ADK.
    D: Return a special string from the tool asking for confirmation.
    E: None of the above
  correct_answer: A
  explanation: While custom logic is possible, `HumanAgent` or `UserProxy` patterns
    are the standard architectural way to handle human interaction in agent flows.
  benchmark_type: multiple_choice
- question: 'Which class allows you to define a tool from an OpenAPI specification?

    '
  options:
    A: OpenApiTool
    B: SwaggerTool
    C: ApiTool
    D: SpecTool
    E: None of the above
  correct_answer: A
  explanation: '`OpenApiTool` is designed to wrap OpenAPI specs into ADK-compatible
    tools.'
  benchmark_type: multiple_choice
- question: 'If you want to use a Google Search tool that returns structured results,
    which tool should you use?

    '
  options:
    A: GoogleSearchTool
    B: SerpApiTool
    C: SearchTool
    D: WebSearch
    E: None of the above
  correct_answer: A
  explanation: '`GoogleSearchTool` (often imported as `google_search`) provides access
    to Google Search.'
  benchmark_type: multiple_choice
- question: 'What is the correct way to access the `session_id` from within a tool''s
    execution logic?

    '
  options:
    A: It is passed as an argument named `session_id`.
    B: Access `self.session_id` (if the tool is a class).
    C: It is available in the `tool_context` object passed to the tool function (if
      configured).
    D: Use `google.adk.get_current_session_id()`.
    E: None of the above
  correct_answer: C
  explanation: Contextual information like `session_id` is injected via `tool_context`
    if the tool signature requests it.
  benchmark_type: multiple_choice
- question: 'Which event type indicates that the model has finished generating a text
    response?

    '
  options:
    A: Event(type='response_complete')
    B: Event(content=...)
    C: Event(status='finished')
    D: The event stream simply ends.
    E: None of the above
  correct_answer: B
  explanation: A standard `Event` with `content` populated (and `partial=False` by
    default) represents a completed turn/response chunk.
  benchmark_type: multiple_choice
- question: 'You want to use a `ParallelAgent` to run three sub-agents. How does the
    `ParallelAgent` determine when it is finished?

    '
  options:
    A: It waits for the first agent to finish.
    B: It waits for all sub-agents to finish their execution.
    C: It runs for a fixed timeout.
    D: It requires a manual stop signal.
    E: None of the above
  correct_answer: B
  explanation: '`ParallelAgent` aggregates results from all its sub-agents.'
  benchmark_type: multiple_choice
- question: 'What is the `model_client` property on an `LlmAgent` used for?

    '
  options:
    A: To directly access the underlying GenAI client for raw API calls.
    B: To change the model name at runtime.
    C: To configure HTTP proxies.
    D: It is an internal property and should not be used.
    E: None of the above
  correct_answer: A
  explanation: It provides access to the configured model client wrapper.
  benchmark_type: multiple_choice
- question: 'How do you specify that a tool function should *not* return its output
    to the model, but instead save it directly to the session state?

    '
  options:
    A: Return `None` from the function.
    B: Use the `side_effect=True` decorator.
    C: This is not possible; all tool outputs go to the model.
    D: Modify the `session.state` directly within the tool and return a confirmation
      string.
    E: None of the above
  correct_answer: D
  explanation: Tools can modify state via context. While they must return *something*
    to the model (the tool response), the *meaningful* data acts as a side effect
    on the state.
  benchmark_type: multiple_choice
- question: 'Which component is responsible for truncating conversation history to
    fit within the model''s context window?

    '
  options:
    A: The `Runner` automatically does this.
    B: The `LlmAgent` handles it internally.
    C: The `ContextFilterPlugin` (or similar compaction logic).
    D: The `SessionService`.
    E: None of the above
  correct_answer: C
  explanation: Plugins like `ContextFilterPlugin` or `CompactionPlugin` (configured
    via `EventsCompactionConfig`) handle history truncation/compaction.
  benchmark_type: multiple_choice
- question: 'You are using a `LoopAgent` and want to prevent it from running infinitely
    if the sub-agents never escalate. Which parameter should you set?

    '
  options:
    A: timeout
    B: max_steps
    C: max_iterations
    D: loop_limit
    E: None of the above
  correct_answer: C
  explanation: '`LoopAgent` uses `max_iterations` to limit the number of times it
    loops through its sub-agents.'
  benchmark_type: multiple_choice
- question: 'Which `RunConfig` parameter allows you to limit the total number of LLM
    calls in a single run to prevent runaway costs?

    '
  options:
    A: max_tokens
    B: call_limit
    C: llm_call_limit
    D: budget
    E: None of the above
  correct_answer: E
  explanation: The correct parameter is `max_llm_calls`.
  benchmark_type: multiple_choice
- question: 'You want to automatically save any file blobs (images, audio) sent by
    the user as artifacts in the artifact service. Which plugin should you use?

    '
  options:
    A: ArtifactSaverPlugin
    B: SaveArtifactsPlugin
    C: BlobStoragePlugin
    D: FilePersistencePlugin
    E: None of the above
  correct_answer: E
  explanation: The correct plugin class is `SaveFilesAsArtifactsPlugin`.
  benchmark_type: multiple_choice
- question: 'When using `LlmAgent` with a model that supports native audio output,
    how do you configure the response modality?

    '
  options:
    A: Set `response_modalities=['AUDIO']` in `RunConfig`.
    B: Pass `audio=True` to the `LlmAgent` constructor.
    C: Use `types.GenerationConfig(response_mime_type='audio/mp3')`.
    D: This is automatically detected based on the input.
    E: None of the above
  correct_answer: A
  explanation: '`RunConfig.response_modalities` controls the expected output format
    (e.g., TEXT, AUDIO).'
  benchmark_type: multiple_choice
- question: 'What is the purpose of `GlobalInstructionPlugin`?

    '
  options:
    A: To set the system instruction for the root agent only.
    B: To inject a specific instruction into the context of *every* agent in the application.
    C: To override the model's safety settings globally.
    D: To provide a fallback instruction if the user prompt is empty.
    E: None of the above
  correct_answer: B
  explanation: '`GlobalInstructionPlugin` appends (or prepends) instructions to all
    agents'' contexts, useful for enforcing global policies.'
  benchmark_type: multiple_choice
- question: 'You need to retry a tool execution automatically if the tool raises a
    specific exception or returns an error. Which plugin can help?

    '
  options:
    A: RetryPlugin
    B: ToolErrorPlugin
    C: ReflectRetryToolPlugin
    D: RobustnessPlugin
    E: None of the above
  correct_answer: E
  explanation: The correct class name is `ReflectAndRetryToolPlugin`.
  benchmark_type: multiple_choice
- question: 'How does `ContextFilterPlugin` generally operate?

    '
  options:
    A: It summarizes the entire conversation history into a single string.
    B: It keeps only the last `N` invocations or messages to fit context limits.
    C: It removes PII (Personally Identifiable Information) from the context.
    D: It filters out tool outputs to save tokens.
    E: None of the above
  correct_answer: B
  explanation: '`ContextFilterPlugin` is primarily used for sliding window context
    management, retaining recent history.'
  benchmark_type: multiple_choice
- question: 'Which class allows you to run an agent loop specifically for debugging
    in a REPL or notebook environment without setting up a full runner loop manually?

    '
  options:
    A: adk.debug_run()
    B: runner.run_debug()
    C: agent.execute_debug()
    D: Runner.debug()
    E: None of the above
  correct_answer: B
  explanation: '`runner.run_debug()` is a convenience method for quick experimentation
    and debugging.'
  benchmark_type: multiple_choice
- question: 'When implementing a `BaseToolset`, what is the `close()` method responsible
    for?

    '
  options:
    A: Deleting the tool definitions from the agent.
    B: Releasing external resources (e.g., closing HTTP sessions, database connections).
    C: Saving the tool state to the session.
    D: Validating the tool arguments.
    E: None of the above
  correct_answer: B
  explanation: '`BaseToolset.close()` is an async lifecycle method for cleaning up
    I/O resources.'
  benchmark_type: multiple_choice
- question: 'Which configuration object is used to enable ''affective dialog'' (emotion
    detection and adaptation) in a live run?

    '
  options:
    A: AffectiveConfig
    B: EmotionConfig
    C: RunConfig(enable_affective_dialog=True)
    D: LiveConfig(affective=True)
    E: None of the above
  correct_answer: C
  explanation: '`RunConfig` has an `enable_affective_dialog` boolean field.'
  benchmark_type: multiple_choice
- question: 'Which class is responsible for orchestrating the complete lifecycle of
    authentication credentials (loading, exchanging, refreshing) in ADK?

    '
  options:
    A: AuthService
    B: CredentialOrchestrator
    C: CredentialManager
    D: AuthLifecycleManager
    E: None of the above
  correct_answer: C
  explanation: '`CredentialManager` (in `google.adk.auth.credential_manager`) handles
    the credential workflow.'
  benchmark_type: multiple_choice
- question: 'How do you enable sending OpenTelemetry traces to Google Cloud Trace
    when running a local API server?

    '
  options:
    A: Set `RunConfig(trace_to_cloud=True)`.
    B: Use the `--trace_to_cloud` flag with `adk api_server`.
    C: Set the environment variable `ADK_ENABLE_CLOUD_TRACE=1`.
    D: Import `google.adk.telemetry` and call `telemetry.enable_cloud_trace()`.
    E: None of the above
  correct_answer: B
  explanation: The CLI command `adk api_server` accepts a `--trace_to_cloud` flag
    to enable this feature.
  benchmark_type: multiple_choice
- question: 'Which URI format is used to connect to Spanner for session storage via
    the `--session_service_uri` flag?

    '
  options:
    A: spanner://projects/{project}/instances/{instance}/databases/{database}
    B: gcp:spanner:{project}:{instance}:{database}
    C: spanner://{project}/{instance}/{database}
    D: google-spanner://{instance}/{database}
    E: None of the above
  correct_answer: A
  explanation: The ADK standard URI format for Spanner is `spanner://projects/.../instances/.../databases/...`.
  benchmark_type: multiple_choice
- question: 'When deploying to Cloud Run using `adk deploy cloud_run`, which flag
    allows you to specify a custom service name?

    '
  options:
    A: --name
    B: --service
    C: --cloud_run_service
    D: --service_id
    E: None of the above
  correct_answer: E
  explanation: The correct flag is `--service_name`.
  benchmark_type: multiple_choice
- question: 'You want to pass an image to an `LlmAgent` as part of the user''s message.
    How should you structure the content?

    '
  options:
    A: types.Content(parts=[types.Part(image=my_image)])
    B: types.Content(parts=[types.Part(inline_data=types.Blob(mime_type='image/png',
      data=...))])
    C: types.Message(image_url='...')
    D: types.Content(role='user', text='Here is an image', attachments=[my_image])
    E: None of the above
  correct_answer: B
  explanation: Images are typically passed as `types.Part` containing `inline_data`
    (Blob) or `file_data`.
  benchmark_type: multiple_choice
- question: 'If a tool execution fails, and you want to handle the exception *within
    the agent''s callback lifecycle* before the model sees it, which callback should
    you use?

    '
  options:
    A: after_tool_callback
    B: on_tool_error_callback
    C: handle_error_callback
    D: tool_exception_handler
    E: None of the above
  correct_answer: B
  explanation: '`on_tool_error_callback` is specifically designed to catch and potentially
    recover from exceptions raised during tool execution.'
  benchmark_type: multiple_choice
- question: 'When defining an `EvalCase` for evaluation, which of the following statements
    is true regarding `conversation` and `conversation_scenario` fields?

    '
  options:
    A: Both must be provided to ensure coverage.
    B: Exactly one of them must be provided (XOR constraint).
    C: Neither is required if `session_input` is set.
    D: '`conversation_scenario` is deprecated; only `conversation` is supported.'
    E: None of the above
  correct_answer: B
  explanation: '`EvalCase` enforces a validator ensuring exactly one of `conversation`
    or `conversation_scenario` is set.'
  benchmark_type: multiple_choice
- question: 'In the context of ADK evaluation, what does the `IntermediateData` object
    primarily capture?

    '
  options:
    A: The internal hidden states of the LSTM model.
    B: The trajectory of tool uses and tool responses generated during an agent's
      execution.
    C: The debug logs printed to stdout.
    D: The raw HTTP requests sent to the Vertex AI API.
    E: None of the above
  correct_answer: B
  explanation: '`IntermediateData` stores `tool_uses`, `tool_responses`, and `intermediate_responses`
    to track the agent''s path to the final answer.'
  benchmark_type: multiple_choice
- question: How do you enable context caching for an entire application?
  options:
    A: Set `context_cache_config` on the `App` instance.
    B: Set `enable_cache=True` on `Runner`.
    C: Set `cache=True` on every `LlmAgent`.
    D: Use `CachePlugin`.
  correct_answer: A
  explanation: '`App.context_cache_config` applies caching to all agents in the app.'
  benchmark_type: configure_adk_features_mc
- question: Which plugin would you use to log all agent interactions to an external
    monitoring service?
  options:
    A: LoggingPlugin (or a custom plugin inheriting BasePlugin).
    B: MonitorPlugin.
    C: EventsCompactionConfig.
    D: MetricService.
  correct_answer: A
  explanation: Plugins (specifically `LoggingPlugin` or custom ones) are the standard
    way to observe execution.
  benchmark_type: configure_adk_features_mc
- question: You want to save specific agent outputs to the session state automatically.
    What `LlmAgent` parameter do you use?
  options:
    A: output_key
    B: save_to_state
    C: state_variable
    D: export_output
  correct_answer: A
  explanation: '`output_key` specifies the session state key to store the agent''s
    final response.'
  benchmark_type: configure_adk_features_mc
- question: To enforce a structured JSON output from an `LlmAgent`, which parameter
    should be set?
  options:
    A: output_schema
    B: response_format
    C: json_schema
    D: structure_config
  correct_answer: A
  explanation: '`output_schema` accepts a Pydantic model to enforce output structure.'
  benchmark_type: configure_adk_features_mc
- question: What is the correct way to provide a static system instruction that benefits
    from context caching?
  options:
    A: Use the `static_instruction` parameter.
    B: Use the `system_instruction` parameter in `generate_content_config`.
    C: Hardcode it in the `instruction` string.
    D: Use `GlobalInstructionPlugin`.
  correct_answer: A
  explanation: '`static_instruction` is specifically designed for invariant content
    to optimize caching.'
  benchmark_type: configure_adk_features_mc
- question: How do you configure an app to support pausing and resuming execution?
  options:
    A: Set `resumability_config` on the `App`.
    B: Use `ResumePlugin`.
    C: Set `persistent=True` on `Runner`.
    D: It is enabled by default.
  correct_answer: A
  explanation: '`App.resumability_config` controls the resumability features.'
  benchmark_type: configure_adk_features_mc
- question: You want to automatically summarize old events to manage context window
    size. What should you configure?
  options:
    A: events_compaction_config on the App.
    B: ContextWindowCompressionConfig in RunConfig.
    C: SummaryAgent as a sub-agent.
    D: max_history in LlmAgent.
  correct_answer: A
  explanation: '`events_compaction_config` on the `App` enables the event summarizer.'
  benchmark_type: configure_adk_features_mc
- question: What is the primary use case for `GlobalInstructionPlugin`?
  options:
    A: Applying a prompt instruction to all agents.
    B: Managing session state.
    C: Configuring LLM parameters.
    D: Defining tools.
  correct_answer: A
  explanation: '`GlobalInstructionPlugin` is designed for Applying a prompt instruction
    to all agents.'
  benchmark_type: configure_adk_features_mc
- question: What is the primary use case for `LoggingPlugin`?
  options:
    A: Observing events without modifying them.
    B: Managing session state.
    C: Configuring LLM parameters.
    D: Defining tools.
  correct_answer: A
  explanation: '`LoggingPlugin` is designed for Observing events without modifying
    them.'
  benchmark_type: configure_adk_features_mc
- question: What is the primary use case for `SaveFilesAsArtifactsPlugin`?
  options:
    A: Saving file inputs/outputs automatically.
    B: Managing session state.
    C: Configuring LLM parameters.
    D: Defining tools.
  correct_answer: A
  explanation: '`SaveFilesAsArtifactsPlugin` is designed for Saving file inputs/outputs
    automatically.'
  benchmark_type: configure_adk_features_mc
- question: What is the primary use case for `ReflectAndRetryToolPlugin`?
  options:
    A: Retrying failed tool calls.
    B: Managing session state.
    C: Configuring LLM parameters.
    D: Defining tools.
  correct_answer: A
  explanation: '`ReflectAndRetryToolPlugin` is designed for Retrying failed tool calls.'
  benchmark_type: configure_adk_features_mc
- question: Which `LlmAgent` parameter (type `str`) is used for Automatically saving
    agent output to session state.?
  options:
    A: output_key
    B: config
    C: settings
    D: setup
  correct_answer: A
  explanation: '`output_key` is used for Automatically saving agent output to session
    state.'
  benchmark_type: configure_adk_features_mc
- question: Which `LlmAgent` parameter (type `Content`) is used for Optimizing context
    caching for fixed instructions.?
  options:
    A: static_instruction
    B: config
    C: settings
    D: setup
  correct_answer: A
  explanation: '`static_instruction` is used for Optimizing context caching for fixed
    instructions.'
  benchmark_type: configure_adk_features_mc
- question: Which `LlmAgent` parameter (type `BaseModel`) is used for Enforcing structured
