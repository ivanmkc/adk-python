  "question": "What is the difference between an agent callback and a global plugin?"
  "rationale": "    Agent callbacks are specific to one agent instance. Plugins are registered
    on the `Runner` and apply globally to all agents. Plugins also run *before* agent
    callbacks and can short-circuit the execution flow.
  "
  "template": "CLASS_DEFINITION"
  "answers":
    - "answer_template": "StringMatchAnswer"
      "answer": "class BasePlugin(ABC):"
