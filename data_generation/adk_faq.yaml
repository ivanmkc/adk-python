    - "category": "Hooks and Lifecycle Methods"
      "question": "What is the difference between an agent callback and a global plugin?"
      "rationale": "Agent callbacks are specific to one agent instance. Plugins are registered\non the `Runner` and apply globally to all agents. Plugins also run *before* agent\ncallbacks and can short-circuit the execution flow."
      "template": "CLASS_DEFINITION"
