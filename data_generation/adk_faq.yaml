    - "category": "Hooks and Lifecycle Methods"
      "question": "What is the difference between an agent callback and a global plugin?"
      "rationale": |
        Use **agent callbacks** (`before_agent_callback`, `after_agent_callback`) for logic that is specific to a *single agent instance*. For example, formatting the output of a particular summarizer agent.

        Use **plugins** for logic that applies *globally* to all agents in your application. This is ideal for cross-cutting concerns like logging all tool calls, implementing a universal caching strategy, or enforcing security policies on every model request.

        **Key Differences:**
        - **Scope:** Callbacks are per-agent; plugins are app-wide.
        - **Execution Order:** For the same event, plugins always run *before* agent callbacks. A plugin can also short-circuit the execution, preventing agent callbacks from running at all.
      "template": "CLASS_DEFINITION"
      "answers":
        - "answer_template": "StringMatchAnswer"
          "answer": "class BasePlugin(ABC):"
          "module_path": "google.adk.plugins.base_plugin"
      "file": "src/google/adk/plugins/base_plugin.py"
      "line_of_code_start": 41
      "line_of_code_end": 41
