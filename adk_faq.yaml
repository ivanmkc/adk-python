  "question": "How is `session.state` actually modified? Can I change it directly?"
  "answer": |
    No, `session.state` is immutable within a turn. Changes are requested by
    including a `state_delta` dictionary in an `Event` object. The `SessionService`
    is responsible for applying this delta to the state between turns.
