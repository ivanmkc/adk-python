- "category": "Hooks and Lifecycle Methods"
  "question": "What is the difference between an agent callback and a global plugin?"
  "answer": |
    Agent callbacks are specific to one agent instance. Plugins are registered
    on the `Runner` and apply globally to all agents. Plugins also run *before* agent
    callbacks and can short-circuit the execution flow.
  "file": "src/google/adk/plugins/base_plugin.py"
  "line_of_code_start": "38"
  "line_of_code_end": "40"
  "test_assertion":
