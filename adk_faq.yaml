- "category": "Hooks and Lifecycle Methods"
  "question": "How can a plugin stop the execution of agent-specific callbacks?"
  "answer": |
    If a plugin's callback method returns any value other than `None`, the `PluginManager`
    halts further processing for that event, and all agent-specific callbacks for
    that event are skipped.
  "file": "src/google/adk/plugins/plugin_manager.py"
  "line_of_code_start": "308"
  "line_of_code_end": "336"
